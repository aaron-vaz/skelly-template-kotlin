# yaml-language-server: $schema=https://raw.githubusercontent.com/aaron-vaz/skelly/main/skelly.schema.json
name: skelly-template-kotlin
description: A modular Kotlin service on Ktor, with optional Exposed and SQLite, convention plugins, Log4j, Spotless, Jib and CI
inputs:
  project_name:
    description: The name of the project, also used as the Gradle root project and the image name (kebab-case, e.g. my-service)
  owner:
    description: The GitHub user or organisation that will own the repository
    default: aaron-vaz
  group:
    description: The reversed domain name you own, the start of the package (for example.co.uk, uk.co.example)
    default: uk.co.aaronvaz
  package:
    description: The base Kotlin package of {{.Inputs.project_name.Value}}, its source directories are derived from it
    default: '{{.Inputs.group.Value}}.{{.Inputs.project_name.Value | lower | replace "-" ""}}'
  database:
    description: Whether the service needs a database, sqlite adds an items domain module with Exposed and SQLite
    default: none
    choices: [none, sqlite]
  java_version:
    description: The JDK to build and run with, limited to the versions that have a distroless Java image
    default: "21"
    choices: ["17", "21", "25"]
# Values for templates to use as .Env.name, derived from the inputs
env:
  package_path: '{{replace "." "/" .Inputs.package.Value}}'
# Workflows and the Gradle wrapper use ${{ }} or $ themselves, so they are copied as-is
raw:
  - github
  - gradlew
  - gradlew.bat
  - gradle/wrapper
# Everything that only applies to one kind of project, plus the template's own files.
# Patterns match the template's own names: the package directory is {{.Env.package_path}}, so it is a * here
exclude:
  - when: '{{ne .Inputs.database.Value "sqlite"}}'
    paths:
      - modules/items
      - server/src/jib
      - server/src/test/kotlin/*/ItemsAssemblyTest.kt
  - paths:
      - TEMPLATE.md
      - .github
# The files for generated projects ship as github/, so GitHub does not run them (or
# Dependabot) in this repository, where the real .github holds the template's own CI
rename:
  - from: github
    to: .github
