name: Image

on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Jib builds the distroless image without a Docker daemon and pushes it to ghcr.io
      - name: Build and push the image
        # The tag goes through the environment, not into the script: a ref name can contain shell syntax
        run: ./gradlew :server:jib "-Pversion=$TAG"
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
