name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version-file: .java-version

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    # Runs ktlint, the tests and the build
    - name: Build
      run: ./gradlew build

    # buildSrc is a build of its own, so ./gradlew build does not check its formatting
    - name: Check buildSrc formatting
      run: ./gradlew -p buildSrc spotlessCheck
