name: Template test
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Renders every variant of the template with skelly and runs the generated
# project's own checks, so a broken template is caught here and not by the
# first project created from it.
jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [none, sqlite]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install skelly
      # The module proxy can serve an old main for a while after a merge, so ask git directly
      run: GOPROXY=direct go install github.com/aaron-vaz/skelly/cmd/skelly@main

    - name: Render ${{ matrix.database }}
      run: skelly init . -dst "$RUNNER_TEMP/demo-service" -no-input -set project_name=demo-service -set database=${{ matrix.database }}

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version-file: ${{ runner.temp }}/demo-service/.java-version

    - uses: gradle/actions/setup-gradle@v4

    - name: Check the generated project
      working-directory: ${{ runner.temp }}/demo-service
      run: ./gradlew build
